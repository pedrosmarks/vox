<div class="login-page">
  <div class="login-container">

    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-wrapper">
        <img src="logo2.jpeg" alt="Vox Cidadão" class="logo-img" />
      </div>
      <h1 class="brand-title">VOX</h1>
      <p class="brand-subtitle">A política de volta ao cidadão</p>
    </div>

    <!-- Card de Cadastro -->
    <div class="login-card">
      <h2 class="card-title">Criar sua conta</h2>

      <form (ngSubmit)="onSubmit()" #cadastroForm="ngForm" novalidate>

        <div class="form-group">
          <label for="name" class="form-label">Nome completo</label>
          <input id="name" type="text" class="form-input" placeholder="Seu nome"
            [(ngModel)]="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">E-mail</label>
          <input id="email" type="email" class="form-input" placeholder="seu@email.com"
            [(ngModel)]="email" name="email" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cpf" class="form-label">CPF</label>
            <input id="cpf" type="text" class="form-input" placeholder="000.000.000-00"
              [(ngModel)]="cpf" name="cpf" required />
          </div>
          <div class="form-group">
            <label for="phone" class="form-label">Telefone</label>
            <input id="phone" type="text" class="form-input" placeholder="(00) 00000-0000"
              [(ngModel)]="phone" name="phone" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="birthDate" class="form-label">Data de nascimento</label>
            <input id="birthDate" type="date" class="form-input"
              [(ngModel)]="birthDate" name="birthDate" />
          </div>
          <div class="form-group">
            <label for="municipality" class="form-label">Município</label>
            <select id="municipality" class="form-input" [(ngModel)]="municipalityId" name="municipality" required>
              <option [ngValue]="null" disabled>Selecione...</option>
              <option *ngFor="let m of municipalities" [ngValue]="m.id">
                {{ m.name }}<span *ngIf="m.state">/{{ m.state }}</span>
              </option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Senha</label>
          <input id="password" type="password" class="form-input" placeholder="••••••••"
            [(ngModel)]="password" name="password" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirmar senha</label>
          <input id="confirmPassword" type="password" class="form-input" placeholder="••••••••"
            [(ngModel)]="confirmPassword" name="confirmPassword" required />
        </div>

        <label class="terms">
          <input type="checkbox" [(ngModel)]="acceptedTerms" name="acceptedTerms" />
          <span>Li e aceito os termos de uso e a política de privacidade.</span>
        </label>

        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button type="submit" class="btn-login" [disabled]="isLoading">
          <span *ngIf="!isLoading">Cadastrar</span>
          <span *ngIf="isLoading" class="loading-spinner">Cadastrando...</span>
        </button>
      </form>

      <div class="card-footer">
        <p class="footer-text">
          Já tem uma conta?
          <a routerLink="/login" class="footer-link">Entrar</a>
        </p>
      </div>
    </div>

    <div class="page-footer">
      <p>© 2026 Vox Cidadão — Todos os direitos reservados</p>
    </div>

  </div>
</div>
